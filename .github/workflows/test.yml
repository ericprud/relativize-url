name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # pretest regenerates relativize-url.js; fail if the committed copy was stale
      - run: npm test

      - name: Check relativize-url.js is up to date with relativize-url.mjs
        run: git diff --exit-code -- relativize-url.js
